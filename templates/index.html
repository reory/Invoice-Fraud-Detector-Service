<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Fraud Detector Service</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 15px; 
        }
        .dashboard-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 30px; 
            margin-bottom: 30px; 
            align-items: center; 
        }

        /* --- THE GAUGE --- */
        .gauge-container {
            position: relative;
            width: 250px;
            height: 125px; /* Half of width */
            margin: 0 auto;
        }

        /* The Grey Background Arch */
        .gauge-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #333;
            border-radius: 250px 250px 0 0; /* Semi-circle */
        }

        /* The Colored Progress Arch */
        .gauge-fill {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--success);
            border-radius: 250px 250px 0 0;
            transform-origin: center bottom;
            transform: rotate(-180deg); /* Hidden initially */
            transition: transform 1s ease, background 1s;
        }

        /* The Inner Cover (to make it a ring) */
        .gauge-cover {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 190px;
            height: 95px;
            background: var(--card-bg);
            border-radius: 190px 190px 0 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 10px;
        }

        /* THE NEEDLE (The White Line) */
        .needle {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 4px;
            height: 110px; /* Length */
            background: #ffffff;
            border-radius: 4px;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-90deg); /* Start at 0% */
            z-index: 10;
            transition: transform 1.2s cubic-bezier(0.17, 0.88, 0.32, 1.28);
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        /* Inputs & Table */
        input, select, button { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #252525; 
            color: white; 
            box-sizing: border-box; 
        }
        button { 
            background: #3498db; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
        }
        button:hover {
            opacity: 0.9;
        }

        /* Audit Log Section Header */
        .audit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .audit-header h2 {
            margin: 0;
            font-size: 1.25rem;
        }
        .audit-header button {
            width: auto;
            padding: 6px 16px;
            margin: 0;
            font-size: 0.85rem;
            background: #444;
        }

        /* Table Styling */
        .table-wrapper {
            overflow-x: auto;
            margin-top: 15px;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        th, td { 
            text-align: left; 
            padding: 12px; 
            border-bottom: 1px solid #333; 
            font-size: 0.9rem;
        }
        th {
            background: #252525;
            color: #aaa;
        }
        .text-fraud { color: var(--danger); font-weight: bold; }
        .text-clear { color: var(--success); font-weight: bold; }
        .reason-tag {
            display: inline-block;
            background: #2a2a2a;
            padding: 2px 8px;
            margin: 2px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #ccc;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Invoice Fraud Detector Service</h1>
    <div class="dashboard-grid">
        <div class="input-panel">
            <input type="text" id="invoice_id" placeholder="Invoice ID">
            <input type="text" id="vendor_name" placeholder="Vendor Name">
            <input type="number" id="amount" placeholder="Amount (£)">
            <select id="category">
                <option value="Software">Software</option>
                <option value="Consulting">Consulting</option>
                <option value="Utilities">Utilities</option>
            </select>
            <button type="button" onclick="loadSample()" style="background: #27ae60; margin-bottom: 5px;">🎲 Load Random Sample</button>
            <button type="button" onclick="runAnalysis()">Run Fraud Analysis</button>
        </div>

        <div class="gauge-wrapper">
            <h3 style="text-align: center;">Risk Level</h3>
            <div class="gauge-container">
                <div class="gauge-bg"></div>
                <div class="gauge-fill" id="gaugeFill"></div>
                <div class="needle" id="gaugeNeedle"></div>
                <div class="gauge-cover">
                    <span id="gaugeText" style="font-size: 24px; font-weight: bold;">0%</span>
                    <small id="verdictLabel">READY</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Audit Log Section -->
    <div class="audit-header">
        <h2>📋 Session Audit Log</h2>
        <button type="button" id="refresh-audit-btn">Refresh Log</button>
    </div>

    <div class="table-wrapper">
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>ID</th>
                    <th>Vendor</th>
                    <th>Amount</th>
                    <th>Confidence</th>
                    <th>Verdict</th>
                    <th>Flagged Reasons</th>
                </tr>
            </thead>
            <tbody id="audit-log-tbody">
                <tr>
                    <td colspan="7" style="text-align: center; color: #888;">No evaluations in current session.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Store full sample record globally
    let currentSample = {};

    function escapeHtml(str) {
        if (typeof str !== "string") return str;
        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function renderAuditLog(logEntries) {
        const tbody = document.getElementById("audit-log-tbody");
        if (!tbody) return;

        if (!logEntries || logEntries.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" style="text-align: center; color: #888;">No evaluations in current session.</td>
                </tr>`;
            return;
        }

        tbody.innerHTML = logEntries.map(entry => {
            const isFraud = entry.verdict && entry.verdict.includes("FRAUD");
            const verdictClass = isFraud ? "text-fraud" : "text-clear";

            let reasonsHtml = "";
            if (Array.isArray(entry.reasons) && entry.reasons.length > 0) {
                reasonsHtml = entry.reasons
                    .map(r => `<span class="reason-tag">${escapeHtml(r)}</span>`)
                    .join(" ");
            } else {
                reasonsHtml = `<span class="reason-tag">None</span>`;
            }

            return `
                <tr>
                    <td><small style="color: #888;">${escapeHtml(entry.timestamp || "")}</small></td>
                    <td><strong>${escapeHtml(entry.invoice_id || "")}</strong></td>
                    <td>${escapeHtml(entry.vendor_name || "")}</td>
                    <td>${escapeHtml(entry.amount || "")}</td>
                    <td>${escapeHtml(entry.confidence || "")}</td>
                    <td class="${verdictClass}">${escapeHtml(entry.verdict || "")}</td>
                    <td>${reasonsHtml}</td>
                </tr>
            `;
        }).join("");
    }

    async function fetchAuditLog() {
        const refreshBtn = document.getElementById("refresh-audit-btn");
        if (refreshBtn) {
            refreshBtn.disabled = true;
            refreshBtn.innerText = "Refreshing...";
        }

        try {
            // Append timestamp parameter to force cache invalidation
            const response = await fetch('/audit_log?t=' + new Date().getTime());
            if (response.ok) {
                const logs = await response.json();
                renderAuditLog(logs);
            } else {
                console.error("Audit log endpoint returned error status:", response.status);
            }
        } catch (err) {
            console.error("Failed to fetch audit log:", err);
        } finally {
            if (refreshBtn) {
                refreshBtn.disabled = false;
                refreshBtn.innerText = "Refresh Log";
            }
        }
    }

    async function loadSample() {
        try {
            const response = await fetch('/get_sample');
            const data = await response.json();

            if (data.error) throw new Error(data.error);

            // Save complete record
            currentSample = data;

            // Fill visible inputs
            document.getElementById('invoice_id').value = data.invoice_id || "";
            document.getElementById('vendor_name').value = data.vendor_name || "";
            document.getElementById('amount').value = data.amount || "";
            document.getElementById('category').value = data.category || "";

        } catch (err) {
            console.error("Failed to load sample:", err);
            alert("Make sure Flask is running and the dataset exists!");
        }
    }

    async function runAnalysis() {
        const payload = {
            // Default fallback values
            invoice_date: new Date().toISOString().split('T')[0],
            invoice_time: 1200,
            payment_terms: "Net 30",
            submitted_by: "Web_User",
            vendor_rating: 5.0,
            bank_account_change: false,
            is_govt_official: false,
            currency: "GBP",
            is_duplicate: false,

            // Spread complete sample
            ...currentSample,

            // Overlay visible form entries
            invoice_id: document.getElementById('invoice_id').value || "INV-001",
            vendor_name: document.getElementById('vendor_name').value,
            amount: parseFloat(document.getElementById('amount').value) || 0,
            category: document.getElementById('category').value
        };

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const res = await response.json();

            if (!response.ok) {
                alert(`Error: ${res["⛔ Error"] || "Prediction failed"}`);
                return;
            }

            const prob = parseFloat(res.confidence.replace('%', '')) / 100;

            // Move Needle (-90 to +90 degrees)
            const needleDegrees = (prob * 180) - 90;
            document.getElementById('gaugeNeedle').style.transform = `translateX(-50%) rotate(${needleDegrees}deg)`;
            
            // Move Fill (-180 to 0 degrees)
            const fillDegrees = (prob * 180) - 180;
            const fill = document.getElementById('gaugeFill');
            fill.style.transform = `rotate(${fillDegrees}deg)`;
            document.getElementById('gaugeText').innerText = res.confidence;

            // Gauge Color Thresholds
            let color = '#4caf50';
            if (prob > 0.4) color = '#ff9800';
            if (prob > 0.7) color = '#f44336';
            fill.style.backgroundColor = color;

            document.getElementById('verdictLabel').innerText = res.verdict;

            // Render live audit log from response payload
            if (res.audit_log) {
                renderAuditLog(res.audit_log);
            }

        } catch (err) { 
            console.error(err);
            alert("Network error: Check Flask server status!"); 
        }
    }

    // Load initial logs on startup and bind refresh listener
    document.addEventListener("DOMContentLoaded", () => {
        fetchAuditLog();

        const refreshBtn = document.getElementById("refresh-audit-btn");
        if (refreshBtn) {
            refreshBtn.addEventListener("click", fetchAuditLog);
        }
    });
</script>
</body>
</html>
